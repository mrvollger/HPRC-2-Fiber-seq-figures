[workspace]
authors = ["Mitchell R. Vollger <mvollger@gmai.com>"]
channels = ["conda-forge", "bioconda"]
description = "Add a short description here"
name = "fire-figures"
platforms = ["linux-64", "osx-64"]
version = "0.1.0"

[tasks]
setup = "bash scripts/setup-r-env.sh"
publish = "bash scripts/publish-figures.sh"
hsca-drivers = "Rscript -e 'rmarkdown::render(\"Rscripts/hsca-drivers-hla.Rmd\", output_dir=\"Tables\", knit_root_dir=getwd())'"
hprc2-pca = "Rscript -e 'rmarkdown::render(\"Rscripts/hprc2-pca.Rmd\", output_dir=\"Tables\", knit_root_dir=getwd())'"
union-peaks = "Rscript -e 'rmarkdown::render(\"Rscripts/union-peaks.Rmd\", output_dir=\"Tables\", knit_root_dir=getwd())'"
union-peaks-test = "Rscript -e 'rmarkdown::render(\"Rscripts/union-peaks.Rmd\", output_dir=\"Tables\", knit_root_dir=getwd(), params=list(use_test=TRUE))'"
union-peaks-mini = "Rscript -e 'rmarkdown::render(\"Rscripts/union-peaks.Rmd\", output_dir=\"Tables\", knit_root_dir=getwd(), params=list(use_mini=TRUE))'"


[dependencies]
r-base = ">=4.1"
r-changepoint = "*"
bioconductor-karyoploter = "==1.28.0"
bioconductor-genomicranges = "*"
r-tidyverse = { version = ">=2.0", channel = "conda-forge" }
r-rcolorbrewer = { channel = "conda-forge" }
r-scales = ">=1.4"
"r-data.table" = "*"
r-ggrepel = "*"
r-cowplot = "*"
r-argparse = "*"
r-glue = "*"
r-ggnewscale = "*"
r-valr = "*"
r-ggforce = "*"
r-xlsx = { channel = "conda-forge" }
"r-r.utils" = { channel = "conda-forge" }
r-splitstackshape = "*"
r-sodium = "*"
r-tidylog = "*"
r-ggpubr = "*"
r-openxlsx = "*"
r-circlize = "*"
r-ggextra = "*"
r-ggridges = "*"
r-ggside = "*"
r-ggh4x = "*"
r-zoo = "*"
radian = "*"
r-languageserver = "*"
htslib = "*"
ca-certificates = "*"
openssl = "*"
open-fonts = "*"
bcftools = "*"
samtools = ">=1.15"
bedops = "*"
datamash = "*"
bedtools = "*"
imagemagick = "*"
r-reticulate = ">=1.38.0,<2"
r-ggbeeswarm = ">=0.7.2,<0.8"
r-weights = ">=1.0.4,<2"
r-pals = ">=1.9,<2"
r-hexbin = ">=1.28.5,<2"
r-runner = { version = ">=0.4.4,<0.5", channel = "conda-forge" }
r-lsa = { version = ">=0.73.3,<0.74", channel = "conda-forge" }
r-devtools = ">=2.4.5,<3"
r-doparallel = ">=1.0.17,<2"
r-patchwork = ">=1.3.2,<2"
r-future = ">=1.67.0,<2"
"r-future.apply" = ">=1.20.0,<2"
